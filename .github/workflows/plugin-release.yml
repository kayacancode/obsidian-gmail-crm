name: Obsidian Plugin Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check tag and plugin versions
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const read = name => JSON.parse(fs.readFileSync(name, 'utf8'));
          const manifest = read('manifest.json');
          assert.equal(process.env.GITHUB_REF_NAME, manifest.version);
          assert.equal(read('package.json').version, manifest.version);
          assert.equal(read('versions.json')[manifest.version], manifest.minAppVersion);
          JS
      - run: npm ci --legacy-peer-deps
      - name: Test and build plugin
        run: |
          npm run test:intelligence
          npx tsc --noEmit
          npm run build
      - name: Prepare plugin assets
        run: |
          mkdir release
          cp main.js manifest.json styles.css release/
          mkdir -p bundle/gmail-crm
          cp main.js manifest.json styles.css bundle/gmail-crm/
          (cd bundle && zip -r "../release/gmail-crm-${GITHUB_REF_NAME}.zip" gmail-crm)
          cd release
          sha256sum * > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
