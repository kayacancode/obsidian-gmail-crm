name: Plugin release
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".gitmodules"
      - "services"
      - "shared/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package*.json"
      - "manifest.json"
      - "main.js"
      - "versions.json"
      - "eslint.config.mjs"
      - "styles.css"
      - ".github/workflows/plugin-release.yml"
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'if (process.env.GITHUB_REF_NAME !== JSON.parse(require("fs").readFileSync("manifest.json")).version) process.exit(1)'
      - name: Attest supported plugin release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/plugin/main.js
            dist/plugin/manifest.json
            dist/plugin/styles.css
      - uses: actions/upload-artifact@v4
        with:
          name: gmail-crm-plugin
          path: dist/plugin/

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gmail-crm-plugin
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: People Atlas ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
