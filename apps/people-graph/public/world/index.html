<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>People World</title><link rel="stylesheet" href="world.css"></head><body><header><a class="logo" href="../">✳ PEOPLE<span>WORLD</span></a><nav><span id="source-label">FICTIONAL DEMO</span><button id="source">Use my network</button><a href="../studio/?theme=architecture">3D district ↗</a></nav></header>
