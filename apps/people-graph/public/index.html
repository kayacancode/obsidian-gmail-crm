<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>People Graph</title>
	<script src="https://accounts.google.com/gsi/client" async defer></script>
	<style>
		:root {
			--bg:#0f1115; --card:#1a1d24; --muted:#8a90a0; --text:#eef0f5; --line:#262a33;
			/* Quadrant palette — aqua/blue/orange validated all-pairs on the dark
			   surface (dataviz six-checks); deprioritize is a muted STATE, not a
			   fourth competing hue: gray + dimmed + no glow. */
			--q-nurture:#199e70; --q-developing:#3987e5; --q-reengage:#d95926; --q-deprioritize:#7a7f8c;
		}
		* { box-sizing:border-box; margin:0; padding:0; }
		body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; height:100vh; }
		header { position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; gap:16px; padding:12px 16px; background:linear-gradient(to bottom, rgba(15,17,21,.95), rgba(15,17,21,0)); pointer-events:none; }
		header > * { pointer-events:auto; }
		header h1 { font-size:1.05rem; letter-spacing:.02em; font-weight:650; }
		#meta { color:var(--muted); font-size:.8rem; }
		#search { margin-left:auto; background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:7px 12px; font-size:.85rem; width:210px; outline:none; display:none; }
		#search:focus { border-color:#3d4351; }
		#signin { display:flex; }
		#legend { position:fixed; bottom:14px; left:14px; z-index:20; display:none; flex-direction:column; gap:6px; background:rgba(26,29,36,.9); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:.75rem; color:var(--muted); }
		#legend .row { display:flex; align-items:center; gap:8px; }
		#legend .dot { width:9px; height:9px; border-radius:50%; }
		#legend .note { margin-top:2px; font-size:.68rem; }
		svg { display:block; width:100vw; height:100vh; }
		.gate { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; z-index:10; }
		.gate p { color:var(--muted); max-width:420px; line-height:1.5; font-size:.92rem; }
		.gate code { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:2px 6px; font-size:.82rem; }
		.gate .token { background:var(--card); border:1px solid var(--line); border-radius:9px; padding:10px 14px; font-family:ui-monospace,Menlo,monospace; font-size:.78rem; word-break:break-all; max-width:520px; user-select:all; }
		button.action { background:var(--card); border:1px solid #3d4351; color:var(--text); border-radius:9px; padding:9px 16px; font-size:.88rem; cursor:pointer; }
		button.action:hover { border-color:#565e70; }
		.node { cursor:grab; }
		.node:active { cursor:grabbing; }
		.node circle { transition:filter .15s, opacity .15s; filter:drop-shadow(0 0 4px currentColor); }
		.node.deprioritize circle { filter:none; opacity:.55; }
		.node:hover circle { filter:drop-shadow(0 0 10px currentColor) brightness(1.35); opacity:1; }
		.node text { fill:rgba(238,240,245,.85); font-size:10px; font-weight:500; pointer-events:none; text-anchor:middle; text-shadow:0 0 6px rgba(0,0,0,.9); transition:opacity .15s; }
		.node.minor text { opacity:0; }
		.node.minor:hover text, .node.focus text { opacity:1; }
		.node.dim circle { opacity:.12; filter:none; }
		.node.dim text { opacity:0; }
		.link { stroke:rgba(200,205,255,.5); transition:stroke-opacity .15s; }
		.link.dim { stroke-opacity:.04 !important; }
		.link.hot { stroke:rgba(255,255,255,.85); stroke-opacity:1 !important; }
		#tooltip { position:fixed; z-index:30; background:rgba(15,17,21,.96); color:var(--text); border:1px solid #3d4351; border-radius:10px; padding:12px 15px; font-size:12px; pointer-events:none; opacity:0; transition:opacity .12s; max-width:320px; box-shadow:0 6px 24px rgba(0,0,0,.5); }
		#tooltip.visible { opacity:1; }
		#tooltip .name { font-weight:650; font-size:13px; margin-bottom:2px; }
		#tooltip .sub { color:var(--muted); font-size:11px; margin-bottom:6px; }
		#tooltip .scores { display:flex; gap:10px; font-size:11px; margin-bottom:4px; }
		#tooltip .scores b { font-weight:650; }
		#tooltip .ctx { color:var(--muted); font-size:11px; line-height:1.45; margin-top:5px; border-top:1px solid var(--line); padding-top:5px; }
	</style>
</head>
<body>
	<header>
		<h1>🕸 People Graph</h1>
		<span id="meta"></span>
		<input id="search" type="search" placeholder="Find a person…" autocomplete="off" />
		<div id="signin"></div>
	</header>
	<div id="legend">
		<div class="row"><span class="dot" style="background:var(--q-nurture)"></span> nurture</div>
		<div class="row"><span class="dot" style="background:var(--q-developing)"></span> developing</div>
		<div class="row"><span class="dot" style="background:var(--q-reengage)"></span> re-engage</div>
		<div class="row"><span class="dot" style="background:var(--q-deprioritize); opacity:.55"></span> deprioritize (dimmed)</div>
		<div class="note">size = combined score · line weight = connection strength</div>
	</div>
	<svg id="graph"></svg>
	<div id="tooltip"></div>
	<div class="gate" id="gate"></div>

	<script src="d3.v7.min.js"></script>
	<script>
		const QUADRANT_COLOR = {
			"nurture": getCss("--q-nurture"),
			"developing": getCss("--q-developing"),
			"re-engage": getCss("--q-reengage"),
			"deprioritize": getCss("--q-deprioritize"),
		};
		function getCss(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

		const gate = document.getElementById("gate");
		const metaEl = document.getElementById("meta");
		const searchEl = document.getElementById("search");
		const legendEl = document.getElementById("legend");
		const tooltip = d3.select("#tooltip");
		let idToken = null;

		function waitForGoogle(timeoutMs = 10000) {
			return new Promise((resolve) => {
				if (window.google?.accounts?.id) return resolve(true);
				const start = Date.now();
				const t = setInterval(() => {
					if (window.google?.accounts?.id) { clearInterval(t); resolve(true); }
					else if (Date.now() - start > timeoutMs) { clearInterval(t); resolve(false); }
				}, 100);
			});
		}

		async function boot() {
			gate.innerHTML = `<p>Loading…</p>`;
			const cfg = await fetch("/api/config").then(r => r.json()).catch(() => ({}));
			if (!cfg.googleClientId) { gate.innerHTML = `<p>Sign-in unavailable — missing Google config.</p>`; return; }
			const ready = await waitForGoogle();
			if (!ready) {
				gate.innerHTML = `<p>Couldn't load Google sign-in.</p><button class="action" id="retry">Retry</button>`;
				document.getElementById("retry").onclick = boot;
				return;
			}
			google.accounts.id.initialize({
				client_id: cfg.googleClientId,
				callback: (resp) => { idToken = resp.credential; load(); },
			});
			google.accounts.id.renderButton(document.getElementById("signin"), { theme: "outline", size: "medium" });
			google.accounts.id.prompt();
			renderGate();
		}

		function renderGate() {
			gate.innerHTML = `<p>Sign in with Google to see your people graph.<br/>You only ever see the graph pushed from <em>your</em> vault.</p>`;
		}

		async function load() {
			gate.innerHTML = `<p>Loading your graph…</p>`;
			const resp = await fetch("/api/graph", { headers: { authorization: "Bearer " + idToken } }).catch(() => null);
			if (!resp || resp.status === 401) {
				idToken = null;
				renderGate();
				if (window.google?.accounts?.id) google.accounts.id.prompt();
				return;
			}
			const data = await resp.json().catch(() => null);
			if (!data || !data.graph || !data.graph.nodes?.length) { renderEmpty(); return; }
			gate.innerHTML = "";
			gate.style.display = "none";
			render(data.graph, data.updatedAt);
		}

		async function renderEmpty() {
			gate.style.display = "flex";
			gate.innerHTML = `
				<p><b>No graph yet.</b></p>
				<p>Push one from Obsidian: settings → <em>Gmail CRM</em> → set the graph URL to this page and paste in a push token, then run the command <code>Push people graph to web</code>.</p>
				<button class="action" id="mint">Get my push token</button>
				<div id="tokenbox"></div>`;
			document.getElementById("mint").onclick = async () => {
				const box = document.getElementById("tokenbox");
				box.innerHTML = `<p>Minting…</p>`;
				const r = await fetch("/api/token", { headers: { authorization: "Bearer " + idToken } }).catch(() => null);
				const d = r && r.ok ? await r.json().catch(() => null) : null;
				box.innerHTML = d?.token
					? `<div class="token">${d.token}</div><p style="margin-top:8px">Paste this into the plugin's <em>Graph push token</em> setting. Keep it private — it lets its holder overwrite your graph.</p>`
					: `<p>Couldn't mint a token — try signing in again.</p>`;
			};
		}

		function render(graph, updatedAt) {
			const width = window.innerWidth, height = window.innerHeight;
			const svg = d3.select("#graph").attr("width", width).attr("height", height);
			svg.selectAll("*").remove();
			const container = svg.append("g");
			svg.call(d3.zoom().scaleExtent([0.15, 4]).on("zoom", (e) => container.attr("transform", e.transform)));

			const nodes = graph.nodes.map(n => ({ ...n }));
			const nodeById = new Map(nodes.map(n => [n.id, n]));
			const links = graph.edges
				.map(l => ({ ...l, source: nodeById.get(l.source), target: nodeById.get(l.target) }))
				.filter(l => l.source && l.target);
			const maxWeight = Math.max(...links.map(l => l.weight || 1), 1);

			const when = updatedAt ? new Date(updatedAt * 1000).toLocaleDateString() : null;
			metaEl.textContent = `${nodes.length} people · ${links.length} connections${when ? ` · pushed ${when}` : ""}`;
			searchEl.style.display = "block";
			legendEl.style.display = "flex";

			const radius = d => 4 + Math.sqrt(Math.max(d.combined || 0, 1)) * 1.6; // ~5px..20px over 0–100

			const sim = d3.forceSimulation(nodes)
				.force("link", d3.forceLink(links).id(d => d.id)
					.distance(d => 130 - (d.weight || 1) / maxWeight * 50)
					.strength(d => 0.15 + (d.weight || 1) / maxWeight * 0.35))
				.force("charge", d3.forceManyBody().strength(d => -120 - (d.combined || 0)))
				.force("center", d3.forceCenter(width / 2, height / 2))
				.force("collision", d3.forceCollide().radius(d => radius(d) + 10))
				.force("x", d3.forceX(width / 2).strength(0.04))
				.force("y", d3.forceY(height / 2).strength(0.04))
				.alphaDecay(0.05).velocityDecay(0.4);

			// Pre-tick headlessly so the graph appears settled, not exploding.
			const preTicks = Math.min(150, Math.max(60, 280 - nodes.length));
			for (let i = 0; i < preTicks; i++) sim.tick();

			const link = container.append("g").selectAll("line").data(links).join("line")
				.attr("class", "link")
				.attr("stroke-width", d => 1 + (d.weight || 1) / maxWeight * 3.5)
				.attr("stroke-opacity", d => 0.25 + (d.weight || 1) / maxWeight * 0.6);

			// Label the top ~40% of nodes by score; the rest label on hover/focus.
			const scores = nodes.map(n => n.combined || 0).sort((a, b) => a - b);
			const labelCut = scores[Math.floor(scores.length * 0.6)] ?? 0;

			const node = container.append("g").selectAll("g").data(nodes).join("g")
				.attr("class", d => "node"
					+ ((d.combined || 0) < labelCut ? " minor" : "")
					+ (d.quadrant === "deprioritize" ? " deprioritize" : ""))
				.call(d3.drag()
					.on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
					.on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
					.on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

			node.append("circle")
				.attr("r", radius)
				.attr("fill", d => QUADRANT_COLOR[d.quadrant] || QUADRANT_COLOR["deprioritize"])
				.attr("color", d => QUADRANT_COLOR[d.quadrant] || QUADRANT_COLOR["deprioritize"]);

			node.append("text")
				.attr("dy", d => -radius(d) - 5)
				.text(d => d.name.length > 22 ? d.name.slice(0, 20) + "…" : d.name);

			const neighbors = new Map(nodes.map(n => [n.id, new Set([n.id])]));
			for (const l of links) { neighbors.get(l.source.id)?.add(l.target.id); neighbors.get(l.target.id)?.add(l.source.id); }

			let focusId = null;
			function applyFocus() {
				if (!focusId) {
					node.classed("dim", false).classed("focus", false);
					link.classed("dim", false).classed("hot", false);
					return;
				}
				const hood = neighbors.get(focusId) || new Set([focusId]);
				node.classed("dim", d => !hood.has(d.id)).classed("focus", d => hood.has(d.id));
				link.classed("hot", l => l.source.id === focusId || l.target.id === focusId)
					.classed("dim", l => l.source.id !== focusId && l.target.id !== focusId);
			}

			node.on("mouseenter", (event, d) => {
				link.classed("hot", l => l.source.id === d.id || l.target.id === d.id);
				const conns = links.filter(l => l.source.id === d.id || l.target.id === d.id)
					.sort((a, b) => (b.weight || 1) - (a.weight || 1));
				const names = conns.map(l => l.source.id === d.id ? l.target.name : l.source.name).slice(0, 5);
				const contexts = [...new Set(conns.flatMap(l => l.contexts || []))].slice(0, 3);
				tooltip.classed("visible", true).html(`
					<div class="name"></div>
					<div class="sub"></div>
					<div class="scores"><span>score <b>${num(d.combined)}</b></span><span>strength <b>${num(d.strength)}</b></span><span>momentum <b>${num(d.momentum)}</b></span></div>
					<div class="sub">${escapeHtml(d.quadrant || "unscored")}${d.lastContact ? " · last contact " + escapeHtml(d.lastContact) : ""}</div>
					${names.length ? `<div class="ctx">↔ ${names.map(escapeHtml).join(", ")}${conns.length > 5 ? "…" : ""}</div>` : ""}
					${contexts.length ? `<div class="ctx">via: ${contexts.map(escapeHtml).join(" · ")}</div>` : ""}`);
				tooltip.select(".name").text(d.name);
				tooltip.select(".sub").text(d.company || "");
				placeTooltip(event);
			})
			.on("mousemove", placeTooltip)
			.on("mouseleave", () => { tooltip.classed("visible", false); if (!focusId) link.classed("hot", false); else applyFocus(); })
			.on("click", (event, d) => {
				event.stopPropagation();
				focusId = focusId === d.id ? null : d.id;
				applyFocus();
			});

			svg.on("click", () => { focusId = null; applyFocus(); });

			function placeTooltip(event) {
				const pad = 14, tw = 330, th = 150;
				const x = Math.min(event.clientX + pad, window.innerWidth - tw);
				const y = Math.min(event.clientY + pad, window.innerHeight - th);
				tooltip.style("left", x + "px").style("top", y + "px");
			}

			searchEl.oninput = () => {
				const q = searchEl.value.trim().toLowerCase();
				if (!q) { focusId = null; applyFocus(); return; }
				const hit = nodes.find(n => n.name.toLowerCase().includes(q));
				focusId = hit ? hit.id : null;
				applyFocus();
			};

			function paint() {
				link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
					.attr("x2", d => d.target.x).attr("y2", d => d.target.y);
				node.attr("transform", d => `translate(${d.x},${d.y})`);
			}
			paint();
			sim.on("tick", paint);
		}

		function num(v) { return typeof v === "number" ? Math.round(v) : "–"; }
		function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

		window.addEventListener("resize", () => { /* graph re-centers on next load; zoom/pan covers resize */ });
		boot();
	</script>
</body>
</html>
